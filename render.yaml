services:
  - type: web
    name: war-room-dashboard
    runtime: python
    # Starter, not free: the free plan spins the service down after 15
    # idle minutes and the next visitor pays a 30-60 second cold start,
    # and its shared CPU made every page render slowly even when awake.
    # Starter stays up around the clock. Changing this line needs a
    # payment method on the Render account or the Blueprint sync fails.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Threaded workers, not gunicorn's default single synchronous one. The
    # default serves exactly one request at a time, so every page, static
    # file and reload queued behind whatever was in flight - one slow
    # dashboard render (dozens of ESPN lookups) made the whole site look
    # down. With threads, cheap requests are answered while a slow one is
    # still waiting on the network. --timeout is worker liveness, generous
    # enough that a long ESPN batch doesn't get the worker killed mid-page.
    startCommand: gunicorn --worker-class gthread --threads 8 --timeout 90 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Lets the app persist reports/picks by committing data/war_room.json
      # into this repo via the GitHub Contents API, instead of a database
      # this free web service has nowhere to put. Needs a GitHub Personal
      # Access Token with `repo` scope (classic) or Contents read/write
      # (fine-grained, scoped to this repo) -- set it manually after the
      # first deploy under this service's Environment tab. Without it the
      # app still runs, but falls back to a local file that's wiped on
      # every restart.
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_REPO
        value: GiffordB/war-room-dashboard
