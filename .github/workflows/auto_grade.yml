name: Auto-grade finished games

# Runs hourly, every day, year-round - hitting the live app's own
# auto-grade-all endpoint (no auth needed, it's a plain POST).
#
# Used to be scoped to just the CFB/NFL football window (Thursday
# evening through Tuesday morning ET), but EPL/UCL fixtures land on
# every day of the week across most of the year (UCL is usually
# Tue/Wed, EPL is Sat/Sun plus midweek rounds), so there's no clean
# "off" window left to skip. Grading is idempotent - an hourly run that
# finds nothing pending to settle is a no-op - so running around the
# clock costs nothing extra on a public repo's free GitHub Actions.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  auto-grade:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-grade finished games
        run: curl -sf --max-time 120 -X POST "https://war-room-dashboard-fus7.onrender.com/reports/auto_grade_all"
