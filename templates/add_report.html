{% extends "base.html" %}
{% block title %}New Report · War Room{% endblock %}
{% block content %}
  <div class="page-head">
    <h1>New Report</h1>
  </div>
  <form class="form" method="post" action="{{ url_for('add_report') }}">
    <div class="form-row">
      <label>
        Source
        <select name="source" required>
          {% for s in sources %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
        </select>
      </label>
      <label>
        League
        <select name="league" id="league" required>
          {% for code in league_order %}<option value="{{ code }}">{{ leagues[code] }}</option>{% endfor %}
        </select>
      </label>
    </div>

    <div class="form-row">
      <label>
        Report Date
        <input type="date" name="report_date" id="report_date" value="{{ today }}" required>
      </label>
      <label>
        Week #
        <input type="number" name="week_number" id="week_number" min="1" max="40" value="1" required>
        <span id="week-status" class="muted small"></span>
      </label>
    </div>

    <label>
      Week / Slate label (optional)
      <input type="text" name="week_label" placeholder="e.g. Week 1 — CFB Openers">
    </label>

    <label>
      👁 Vegas Blind Spot notes (optional)
      <textarea name="blind_spot_notes" rows="3" placeholder="Teams the market keeps missing — QB leap, new scheme, covers with substance."></textarea>
    </label>

    <label>
      🐯 LSU Objective Review notes (optional)
      <textarea name="lsu_review_notes" rows="3" placeholder="Same scorecard, same discipline. Pass means pass."></textarea>
    </label>

    <div class="actions">
      <button class="btn" type="submit">Create Report</button>
      <a class="btn btn-outline" href="{{ url_for('reports_list') }}">Cancel</a>
    </div>
  </form>
{% endblock %}

{% block scripts %}
<script>
(function () {
  // Auto-fills Week # from ESPN's own current-week data (see
  // odds.season_week()) instead of leaving it to be hand-counted and
  // mislabeled - stops adjusting once the field is edited by hand.
  const leagueSelect = document.getElementById('league');
  const dateInput = document.getElementById('report_date');
  const weekInput = document.getElementById('week_number');
  const statusEl = document.getElementById('week-status');
  let userEdited = false;

  weekInput.addEventListener('input', () => {
    userEdited = true;
    statusEl.textContent = '';
  });

  async function fillWeek() {
    if (userEdited) return;
    const league = leagueSelect.value;
    const date = dateInput.value ? dateInput.value.replace(/-/g, '') : '';
    statusEl.textContent = 'looking up…';
    try {
      const res = await fetch(`/api/week?league=${encodeURIComponent(league)}&date=${date}`);
      if (!res.ok || userEdited) { statusEl.textContent = ''; return; }
      const data = await res.json();
      weekInput.value = data.week;
      statusEl.textContent = 'auto-filled from ESPN';
    } catch (err) {
      statusEl.textContent = '';
    }
  }

  leagueSelect.addEventListener('change', fillWeek);
  dateInput.addEventListener('change', fillWeek);
  fillWeek();
})();
</script>
{% endblock %}
